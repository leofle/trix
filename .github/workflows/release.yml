name: Release

# Pushing a tag like v1.0.1 builds trix for four platforms and attaches
# the archives to that tag's GitHub release, making the release first if
# there isn't one. Run it by hand with a tag to add them to an existing
# release, such as v1.0.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach archives to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml's version $version"
            exit 1
          fi
      - name: Make the release if there isn't one
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "trix ${TAG#v}" --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 links against an older glibc than ubuntu-latest,
          # so the Linux builds run on more distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=trix-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/trix LICENSE README.md "$name"/
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Attach to the release
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  # Point the Homebrew formula in leofle/homebrew-trix at this release.
  # Pushing to another repo needs a token of its own: a fine-grained one
  # with Contents read and write on homebrew-trix, saved in this repo as
  # the HOMEBREW_TAP_TOKEN secret. Without it, this job only says so.
  homebrew:
    needs: build
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Say if there's no token
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew formula still points at the last release"
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          gh release download "$TAG" --pattern '*.sha256' --dir sums
          git clone "https://x-access-token:$TAP_TOKEN@github.com/leofle/homebrew-trix.git" tap
          packaging/homebrew-formula.sh "${TAG#v}" sums > tap/Formula/trix.rb
          cd tap
          if git diff --quiet; then
            echo "The formula is already at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "trix ${TAG#v}"
          git push

  # Update the trix and trix-bin packages on the AUR to this release.
  # Pushing there needs an SSH key registered to the maintainer's AUR
  # account, saved in this repo as the AUR_SSH_KEY secret. Without it,
  # this job only says so.
  aur:
    needs: build
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - name: Say if there's no key
        if: env.AUR_SSH_KEY == ''
        run: echo "::warning::AUR_SSH_KEY isn't set, so the AUR packages still point at the last release"
      - uses: actions/checkout@v4
        if: env.AUR_SSH_KEY != ''
      - name: Update the AUR packages
        if: env.AUR_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh release download "$TAG" --pattern '*.sha256' --dir sums
          packaging/aur.sh "${TAG#v}" sums out
          for pkg in trix trix-bin; do
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "aur-$pkg"
            cp "out/$pkg/PKGBUILD" "out/$pkg/.SRCINFO" "aur-$pkg/"
            git -C "aur-$pkg" add PKGBUILD .SRCINFO
            if git -C "aur-$pkg" diff --cached --quiet; then
              echo "$pkg is already at $TAG"
            else
              git -C "aur-$pkg" commit -m "trix ${TAG#v}"
              git -C "aur-$pkg" push origin HEAD:master
            fi
          done
